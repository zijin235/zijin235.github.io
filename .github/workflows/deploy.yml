name: Deploy Nuxt to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci 对 Rolldown 可选原生依赖存在已知漏装问题：先跳过 postinstall，
      # 再显式补齐 Linux binding，最后运行 Nuxt prepare。
      - name: Install dependencies
        run: |
          npm ci --ignore-scripts --registry=https://registry.npmjs.org
          npm install --no-save --ignore-scripts @rolldown/binding-linux-x64-gnu@1.2.6 --registry=https://registry.npmjs.org
          npm run postinstall

      - name: Generate static site
        run: npm run generate

      - name: Add .nojekyll
        run: touch .output/public/.nojekyll

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .output/public
          publish_branch: gh-pages
          force_orphan: true